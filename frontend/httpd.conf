# Ensure these modules are loaded (uncommented)
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so

# The standard ServerName to avoid warnings
ServerName localhost

# The Reverse Proxy configuration
<VirtualHost *:80>
    DocumentRoot "/usr/local/apache2/htdocs"

    # Forward all /api requests to the python_app container
    # Note: 'python_app' is the service name in your docker-compose
    ProxyPass "/api" "http://python_app:8080/"
    ProxyPassReverse "/api" "http://python_app:8080/"

    # Forward Documentation (FastAPI/Swagger)
    ProxyPass "/docs" "http://python_app:8080/docs"
    ProxyPassReverse "/docs" "http://python_app:8080/docs"

    # If your backend uses OpenAPI/Swagger, it often needs /openapi.json too
    ProxyPass "/openapi.json" "http://python_app:8080/openapi.json"
    ProxyPassReverse "/openapi.json" "http://python_app:8080/openapi.json"
    
    <Directory "/usr/local/apache2/htdocs">
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>