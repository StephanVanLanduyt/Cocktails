<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Search</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="menu-container">
        <h1>🍸 Recipe Finder 🍹</h1>

        <div class="search-area">
            <input type="text" id="recipe-name-input" placeholder="Enter recipe name">
            <button onclick="searchRecipe()">Search</button>
        </div>

        <div class="multiplier-bar" id="multiplier-bar" style="display:none;">
            <button id="mult-1" class="active" onclick="setMultiplier(1)">1X</button>
            <button id="mult-2" onclick="setMultiplier(2)">2X</button>
            <button id="mult-3" onclick="setMultiplier(3)">3X</button>
            <button id="mult-4" onclick="setMultiplier(4)">4X</button>
            <button id="mult-5" onclick="setMultiplier(5)">5X</button>
        </div>

        <div id="recipe-info">
            <div class="error-message" id="error-message" style="display: none;"></div>
            
            <div class="spinner-container" id="spinner-container" style="display: none;">
                <div class="spinner"></div>
                <p>Searching...</p>
            </div>
            
            <div class="card-grid" id="recipe-card-grid">
                </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
