# Load required modules
# (If they are already loaded in the main config, Apache will just ignore these)
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so

# Environment-agnostic Proxy
# This works because both Dev and Prod use the service name 'cocktails-backend'
ProxyPass "/api" "http://cocktails-backend:8080"
ProxyPassReverse "/api" "http://cocktails-backend:8080"

ProxyPass "/docs" "http://cocktails-backend:8080/docs"
ProxyPassReverse "/docs" "http://cocktails-backend:8080/docs"

ProxyPass "/openapi.json" "http://cocktails-backend:8080/openapi.json"
ProxyPassReverse "/openapi.json" "http://cocktails-backend:8080/openapi.json"