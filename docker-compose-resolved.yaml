name: cocktails
services:
  Apache:
    container_name: CocktailsApache
    depends_on:
      python-app:
        condition: service_started
        required: true
    image: 192.168.1.4:23000/stephanvanlanduyt/cocktails-frontend:1.0.20260716@sha256:5664d2e7a996bc3b0901b94b17df4e515d5fdc38e5261c1f7bc6774864ee06cb
    networks:
      default: null
    ports:
      - mode: ingress
        target: 80
        published: "3333"
        protocol: tcp
    restart: unless-stopped
  postgres-db:
    container_name: CocktailsDB
    environment:
      POSTGRES_DB: cocktails
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    image: postgres:15.18@sha256:74e110c41804365e3915fcc09d5e7a1eff50161aaa94d5da0e58e0cd75ae509c
    networks:
      default: null
    ports:
      - mode: ingress
        target: 5432
        published: "23456"
        protocol: tcp
    volumes:
      - type: bind
        source: /home/steph/appdata/cocktails/config/postgres
        target: /var/lib/postgresql/data
        bind:
          create_host_path: true
  python-app:
    container_name: CocktailsApi
    depends_on:
      postgres-db:
        condition: service_started
        required: true
    environment:
      PG_DSN: postgresql+psycopg2://postgres:postgres@postgres-db:5432/cocktails
    image: 192.168.1.4:23000/stephanvanlanduyt/cocktails-backend:1.0.20260716@sha256:e3323b564580adfb778045e21d285271568d8bba525857bfff09643ad2a694f7
    networks:
      default: null
    ports:
      - mode: ingress
        target: 8080
        published: "50800"
        protocol: tcp
networks:
  default:
    name: cocktails_default
