name: Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  docker:
    name: Build Docker Images
    runs-on: self-hosted
    # Workflow environment variables
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Build
      run: docker build ./backend --file ./backend/Dockerfile --tag cocktails:$(date +%Y%m%d) --tag cocktails:latest
