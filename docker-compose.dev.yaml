version: '3'

services:
  postgres_db:
    image: postgres:15.18@sha256:8b2bad884a8156e63d942305d0c547baa41f81953c93dbfc9e6cfe6f90bb8277
    container_name: CocktailsDBDev
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
    ports:
      - 34567:5432
    volumes:
      - ${POSTGRES_DATA_PATH}:/var/lib/postgresql/data/

  python_app:
    image: 192.168.1.4:23000/stephanvanlanduyt/cocktails-backend:1.0.20260611@sha256:e3bd91a6cda9c8d3fa86be8439da49c32fc23c09b7b8a8b404d6514b6358b127
    container_name: CocktailsApiDev
    environment:
      - PG_DSN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_db:5432/${POSTGRES_DB}
    ports:
      - 50802:8080
    depends_on:
      - postgres_db

  Apache:
    image: httpd:2.4.68-alpine@sha256:1b766f17b84026429b7cb243317b142921b24432336e798bc881c43f45ed9567
    ports:
      - 33333:80 
    container_name: CocktailsApacheDev
    restart: unless-stopped
    volumes:
      - ${APACHE_CONFIG_PATH}:/usr/local/apache2/conf/extra/cocktails.conf
      - ${APACHE_SRC_PATH}:/usr/local/apache2/htdocs
    command: httpd-foreground -c "Include conf/extra/cocktails.conf"
    depends_on:
      - python_app
