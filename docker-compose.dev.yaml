version: '3'

services:
  postgres_db:
    image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    container_name: CocktailsDBDev
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
    ports:
      - 34567:5432
    volumes:
      - ${POSTGRES_DATA_PATH}:/var/lib/postgresql/data/

  python_app:
    image: 192.168.1.4:23000/stephanvanlanduyt/cocktails-backend:1.0.20260716@sha256:e3323b564580adfb778045e21d285271568d8bba525857bfff09643ad2a694f7
    container_name: CocktailsApiDev
    environment:
      - PG_DSN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_db:5432/${POSTGRES_DB}
    ports:
      - 50802:8080
    depends_on:
      - postgres_db

  Apache:
    image: httpd:2.4.68-alpine@sha256:1b766f17b84026429b7cb243317b142921b24432336e798bc881c43f45ed9567
    ports:
      - 33333:80 
    container_name: CocktailsApacheDev
    restart: unless-stopped
    volumes:
      - ${APACHE_CONFIG_PATH}:/usr/local/apache2/conf/extra/cocktails.conf
      - ${APACHE_SRC_PATH}:/usr/local/apache2/htdocs
    command: httpd-foreground -c "Include conf/extra/cocktails.conf"
    depends_on:
      - python_app
