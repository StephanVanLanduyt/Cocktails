version: '3'

services:
  postgres_db:
    image: postgres:15.15@sha256:a7711af921c380de0fda7c48a61fab5ac4def145fd9fc00ccea7355fd6270bb4
    container_name: CocktailsDBDev
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=cocktails
      - POSTGRES_USER=postgres
    ports:
      - 34567:5432
    volumes:
      - /portainer/Files/AppData/Config/Cocktails/Postgres_15_Dev:/var/lib/postgresql/data/

  python_app:
    image: 192.168.1.5:23000/stephanvanlanduyt/cocktails-backend:1.0.20251229@sha256:bdd2b55839cb4b6a1a086083f78d8657d0c8b1fa9326155b7038d50af62dd7e6
    container_name: CocktailsApiDev
    environment:
      - PG_DSN=postgresql+psycopg2://postgres:postgres@postgres_db:5432/cocktails
    ports:
      - 50802:8080
    depends_on:
      - postgres_db

  Apache:
    image: httpd:2.4.66-alpine@sha256:6b7535d8a33c42b0f0f48ff0067765d518503e465b1bf6b1629230b62a466a87
    ports:
      - 33333:80 
    container_name: CocktailsApacheDev
    restart: unless-stopped
    volumes:
      - /portainer/Files/AppData/Config/Cocktails/frontend/apache/cocktails.conf:/usr/local/apache2/conf/extra/cocktails.conf
      - /portainer/Files/AppData/Config/Cocktails/frontend/src:/usr/local/apache2/htdocs
    command: httpd-foreground -c "Include conf/extra/cocktails.conf"
    depends_on:
      - python_app
