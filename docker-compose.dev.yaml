version: '3'

services:
  postgres_db:
    image: postgres:15.17@sha256:36388d068f460ae61d9701625cbd0deb0008f6aeaf759bf2c7b64dba59950e45
    container_name: CocktailsDBDev
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=cocktails
      - POSTGRES_USER=postgres
    ports:
      - 34567:5432
    volumes:
      - /portainer/Files/AppData/Config/Cocktails/Postgres_15_Dev:/var/lib/postgresql/data/

  python_app:
    image: 192.168.1.5:23000/stephanvanlanduyt/cocktails-backend:1.0.20260316@sha256:700839a7b0de5a6bc5128a837c97cd3e6bca58cd87202191eeafb42446f8a66a
    container_name: CocktailsApiDev
    environment:
      - PG_DSN=postgresql+psycopg2://postgres:postgres@postgres_db:5432/cocktails
    ports:
      - 50802:8080
    depends_on:
      - postgres_db

  Apache:
    image: httpd:2.4.67-alpine@sha256:0136c2d4462f3b8ecc92bea70efdfef4d06523999ae8d7aa533969dea6db4576
    ports:
      - 33333:80 
    container_name: CocktailsApacheDev
    restart: unless-stopped
    volumes:
      - /portainer/Files/AppData/Config/Cocktails/frontend/apache/cocktails.conf:/usr/local/apache2/conf/extra/cocktails.conf
      - /portainer/Files/AppData/Config/Cocktails/frontend/src:/usr/local/apache2/htdocs
    command: httpd-foreground -c "Include conf/extra/cocktails.conf"
    depends_on:
      - python_app
