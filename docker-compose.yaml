version: '3'

services:
  postgres_db:
    image: postgres:15.18@sha256:2e2c9831b5271ccc64e5cc8819ccfc3368a4c3e0d8afc74ca9da28b9b8d937b6
    container_name: CocktailsDB
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=cocktails
      - POSTGRES_USER=postgres
    ports:
      - 23456:5432
    volumes:
      - /portainer/Files/AppData/Config/Cocktails/Postgres_15:/var/lib/postgresql/data/

  python_app:
    image: 192.168.1.4:23000/stephanvanlanduyt/cocktails-backend:1.0.20260506@sha256:7f52a0eac52f3aa4d3cc696f30b05d9a92e6947dc0607865362fa3717eed779f
    container_name: CocktailsApi
    environment:
      - PG_DSN=postgresql+psycopg2://postgres:postgres@postgres_db:5432/cocktails
    ports:
      - 50800:8080
    depends_on:
      - postgres_db
    labels:
      - com.centurylinklabs.watchtower.enable=true

  Apache:
    image: 192.168.1.4:23000/stephanvanlanduyt/cocktails-frontend:1.0.20260506@sha256:531c2043f54a26d3be7094807108a7eaa933ec9aaf2c041403259e044f93f5a3
    ports:
      - 3333:80 
    container_name: CocktailsApache
    restart: unless-stopped
    depends_on:
      - python_app
