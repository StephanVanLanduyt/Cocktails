version: '3'

services:
  postgres_db:
    image: postgres:15.18@sha256:2e2c9831b5271ccc64e5cc8819ccfc3368a4c3e0d8afc74ca9da28b9b8d937b6
    container_name: CocktailsDB
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
    ports:
      - 23456:5432
    volumes:
      - ${POSTGRES_DATA_PATH}:/var/lib/postgresql/data/

  python_app:
    image: 192.168.1.4:23000/stephanvanlanduyt/cocktails-backend:1.0.20260528@sha256:22fd9f8d8ff801d6351e1cdab0b87e493461284a0b7c027a0ae44b4681b90ddd
    container_name: CocktailsApi
    environment:
      - PG_DSN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_db:5432/${POSTGRES_DB}
    ports:
      - 50800:8080
    depends_on:
      - postgres_db

  Apache:
    image: 192.168.1.4:23000/stephanvanlanduyt/cocktails-frontend:1.0.20260611@sha256:bf9c9e524ae814b00435b70c4f67c23cb145c1c250c8dd94273a5bf50dead6ad
    ports:
      - 3333:80 
    container_name: CocktailsApache
    restart: unless-stopped
    depends_on:
      - python_app
