version: '3'

services:
  postgres_db:
    image: postgres:15.15@sha256:42283dfbd8b955b4ddf43b6df49356ee2cf10a5957839a0e8d1b568c38b54fc2
    container_name: CocktailsDB
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=cocktails
      - POSTGRES_USER=postgres
    ports:
      - 23456:5432
    volumes:
      - /portainer/Files/AppData/Config/Cocktails/Postgres_15:/var/lib/postgresql/data/

  python_app:
    image: 192.168.1.5:23000/stephanvanlanduyt/cocktails-backend:1.0.20260108@sha256:26bd09cfd4c1a42a0b8937e765c3e304bee3905582978b79e99752807364dd0a
    container_name: CocktailsApi
    environment:
      - PG_DSN=postgresql+psycopg2://postgres:postgres@postgres_db:5432/cocktails
    ports:
      - 50800:8080
    depends_on:
      - postgres_db
    labels:
      - com.centurylinklabs.watchtower.enable=true

  Apache:
    image: 192.168.1.5:23000/stephanvanlanduyt/cocktails-frontend:1.0.20260108@sha256:2e2f9194b69b242faf38a469fd8ffa8c6ff0fecb25572a65fcba0f319fdc866d
    ports:
      - 3333:80 
    container_name: CocktailsApache
    restart: unless-stopped
    depends_on:
      - python_app
