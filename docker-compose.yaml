version: '3'

services:
  postgres_db:
    image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    container_name: CocktailsDB
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
    ports:
      - 23456:5432
    volumes:
      - ${POSTGRES_DATA_PATH}:/var/lib/postgresql/data/

  python_app:
    image: 192.168.1.4:23000/stephanvanlanduyt/cocktails-backend:1.0.20260716@sha256:e3323b564580adfb778045e21d285271568d8bba525857bfff09643ad2a694f7
    container_name: CocktailsApi
    environment:
      - PG_DSN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_db:5432/${POSTGRES_DB}
    ports:
      - 50800:8080
    depends_on:
      - postgres_db

  Apache:
    image: 192.168.1.4:23000/stephanvanlanduyt/cocktails-frontend:1.0.20260716@sha256:5664d2e7a996bc3b0901b94b17df4e515d5fdc38e5261c1f7bc6774864ee06cb
    ports:
      - 3333:80 
    container_name: CocktailsApache
    restart: unless-stopped
    depends_on:
      - python_app
