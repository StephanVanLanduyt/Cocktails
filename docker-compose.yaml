version: '3'

services:
  postgres_db:
    image: postgres:15.15@sha256:a7711af921c380de0fda7c48a61fab5ac4def145fd9fc00ccea7355fd6270bb4
    container_name: CocktailsDB
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=cocktails
      - POSTGRES_USER=postgres
    ports:
      - 23456:5432
    volumes:
      - /portainer/Files/AppData/Config/Cocktails/Postgres_15:/var/lib/postgresql/data/

  python_app:
    image: 192.168.1.5:23000/stephanvanlanduyt/cocktails-backend:20251229@sha256:bdd2b55839cb4b6a1a086083f78d8657d0c8b1fa9326155b7038d50af62dd7e6
    container_name: CocktailsApi
    environment:
      - PG_DSN=postgresql+psycopg2://postgres:postgres@postgres_db:5432/cocktails
    ports:
      - 50800:8080
    depends_on:
      - postgres_db
    labels:
      - com.centurylinklabs.watchtower.enable=true

  Apache:
    image: 192.168.1.5:23000/stephanvanlanduyt/cocktails-frontend:20251229@sha256:bd4d4bd13e0543d612682b23b3123c46fef6322e0acbc3382e1446ea57227af9
    ports:
      - 3333:80 
    container_name: CocktailsApache
    restart: unless-stopped
    depends_on:
      - python_app
