version: '3'

services:
  postgres_db:
    image: postgres:15.18@sha256:74e110c41804365e3915fcc09d5e7a1eff50161aaa94d5da0e58e0cd75ae509c
    container_name: CocktailsDB
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
    ports:
      - 23456:5432
    volumes:
      - ${POSTGRES_DATA_PATH}:/var/lib/postgresql/data/

  python_app:
    image: 192.168.1.4:23000/stephanvanlanduyt/cocktails-backend:1.0.20260816@sha256:ec5b1be9d4e6b6c387cedbf521f3283d15574e8506ab9f8942a27867b85c7940
    container_name: CocktailsApi
    environment:
      - PG_DSN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_db:5432/${POSTGRES_DB}
    ports:
      - 50800:8080
    depends_on:
      - postgres_db

  Apache:
    image: 192.168.1.4:23000/stephanvanlanduyt/cocktails-frontend:1.0.20260716@sha256:5664d2e7a996bc3b0901b94b17df4e515d5fdc38e5261c1f7bc6774864ee06cb
    ports:
      - 3333:80 
    container_name: CocktailsApache
    restart: unless-stopped
    depends_on:
      - python_app
