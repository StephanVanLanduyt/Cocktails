version: '3'

services:
  postgres_db:
    image: postgres:15.15@sha256:a7711af921c380de0fda7c48a61fab5ac4def145fd9fc00ccea7355fd6270bb4
    container_name: CocktailsDB
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=cocktails
      - POSTGRES_USER=postgres
    ports:
      - 23456:5432
    volumes:
      - /portainer/Files/AppData/Config/Cocktails/Postgres_15:/var/lib/postgresql/data/

  python_app:
    image: 192.168.1.5:23000/stephanvanlanduyt/cocktails-backend:1.0.20260107@sha256:3eb5230040366bf12ed7e08c9c062a05716d1c336db5e6b53fe34b65cc93c262
    container_name: CocktailsApi
    environment:
      - PG_DSN=postgresql+psycopg2://postgres:postgres@postgres_db:5432/cocktails
    ports:
      - 50800:8080
    depends_on:
      - postgres_db
    labels:
      - com.centurylinklabs.watchtower.enable=true

  Apache:
    image: 192.168.1.5:23000/stephanvanlanduyt/cocktails-frontend:1.0.20260107@sha256:4f00f0a3e873bc44d80eb6b5337dd9fb27d089b40e727605e785f212d69b2ddb
    ports:
      - 3333:80 
    container_name: CocktailsApache
    restart: unless-stopped
    depends_on:
      - python_app
