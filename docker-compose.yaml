version: '3'

services:
  postgres_db:
    image: postgres:15.16@sha256:dafc4d8e8369da730a5ee9a320a0f0b3c6aa516f41244689c4493a27dc84472d
    container_name: CocktailsDB
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=cocktails
      - POSTGRES_USER=postgres
    ports:
      - 23456:5432
    volumes:
      - /portainer/Files/AppData/Config/Cocktails/Postgres_15:/var/lib/postgresql/data/

  python_app:
    image: 192.168.1.5:23000/stephanvanlanduyt/cocktails-backend:1.0.20260108@sha256:26bd09cfd4c1a42a0b8937e765c3e304bee3905582978b79e99752807364dd0a
    container_name: CocktailsApi
    environment:
      - PG_DSN=postgresql+psycopg2://postgres:postgres@postgres_db:5432/cocktails
    ports:
      - 50800:8080
    depends_on:
      - postgres_db
    labels:
      - com.centurylinklabs.watchtower.enable=true

  Apache:
    image: 192.168.1.5:23000/stephanvanlanduyt/cocktails-frontend:1.0.20260108@sha256:211e1fac3f741bd8d4e7bbec685ccb47c9033c39e04570f2bff94959883fc84f
    ports:
      - 3333:80 
    container_name: CocktailsApache
    restart: unless-stopped
    depends_on:
      - python_app
