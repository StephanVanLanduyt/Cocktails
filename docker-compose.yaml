version: '3'

services:
  postgres_db:
    image: postgres:15.15@sha256:a7711af921c380de0fda7c48a61fab5ac4def145fd9fc00ccea7355fd6270bb4
    container_name: CocktailsDB
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=cocktails
      - POSTGRES_USER=postgres
    ports:
      - 23456:5432
    volumes:
      - /portainer/Files/AppData/Config/Cocktails/Postgres_15:/var/lib/postgresql/data/

  python_app:
    image: 192.168.1.5:23000/stephanvanlanduyt/cocktails-backend:1.0.20251229@sha256:0db21041bed41877706a5233c4808cdf2715716f46ae46ee02c9dfb6fbcf35b5
    container_name: CocktailsApi
    environment:
      - PG_DSN=postgresql+psycopg2://postgres:postgres@postgres_db:5432/cocktails
    ports:
      - 50800:8080
    depends_on:
      - postgres_db
    labels:
      - com.centurylinklabs.watchtower.enable=true

  Apache:
    image: 192.168.1.5:23000/stephanvanlanduyt/cocktails-frontend:1.0.20260107@sha256:2e05856df1bb8c6a2df4e11d0d27681e80da5ecd002bb29ff66429648cbeef9c
    ports:
      - 3333:80 
    container_name: CocktailsApache
    restart: unless-stopped
    depends_on:
      - python_app
